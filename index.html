<style>
  :root{
    --bg:#f4f5f8;
    --card-border:#e4e6ee;
    --text:#1a1f28;
    --muted:#6b7280;
    --icon-bg:#4f6bed;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161d;
      --card-border:#2a3140;
      --text:#e4e7ee;
      --muted:#8a92a3;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    justify-content:center;
    padding:60px 20px 40px;
  }
  .wrap{width:100%;max-width:560px;}

  .brand{text-align:center;margin-bottom:36px;}
  .brand-icon{
    width:88px;height:88px;
    border-radius:50%;
    border:2px solid var(--card-border);
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 16px;
  }
  .brand h1{font-size:24px;margin:0 0 6px;font-weight:800;}
  .brand p{margin:0;color:var(--muted);font-size:14px;}

  .cards{display:flex;flex-direction:column;gap:12px;}
  .card{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 18px;
    border-radius:12px;
    border:1px solid var(--card-border);
    text-decoration:none;
    color:inherit;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(20,25,35,.08);}
  .card-icon{
    flex:none;
    width:38px;height:38px;
    border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    font-weight:800;
    color:#fff;
  }
  .card-body{flex:1;min-width:0;}
  .card-name{font-weight:700;font-size:15px;}
  .card-desc{font-size:12px;color:var(--muted);margin-top:2px;}
  .card-arrow{flex:none;color:var(--muted);font-size:18px;}

  .card.json{background:#fdeef1;border-color:#f6cdd6;}
  .card.json .card-icon{background:#e0587a;}
  .card.json .card-name{color:#a3324e;}

  .card.html{background:#fff3e6;border-color:#f6dfc2;}
  .card.html .card-icon{background:#e08a2f;font-size:14px;}
  .card.html .card-name{color:#a3641f;}

  footer{text-align:center;margin-top:40px;font-size:12px;color:var(--muted);}
  footer a{color:inherit;font-weight:600;text-decoration:none;}
  footer a:hover{text-decoration:underline;}
</style>
</head>
